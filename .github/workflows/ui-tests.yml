name: UI Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_REPO: https://github.com/frappe/frappe
  FRAPPE_BRANCH: version-16
  ERPNEXT_REPO: https://github.com/frappe/erpnext
  ERPNEXT_BRANCH: version-16
  PLAYWRIGHT_BASE_URL: http://localhost:8000
  FRAPPE_TEST_USER: Administrator
  FRAPPE_TEST_PASSWORD: admin

jobs:
  ui-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Playwright

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('tests/ui/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path "$FRAPPE_REPO" --frappe-branch "$FRAPPE_BRANCH" ~/frappe-bench

      - name: Install apps and site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch="$ERPNEXT_BRANCH" erpnext "$ERPNEXT_REPO"
          bench get-app erpnext_thailand_localization "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password "$FRAPPE_TEST_PASSWORD" test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app erpnext_thailand_localization
          bench use test_site
          bench --site test_site set-config allow_tests true
          bench build
        env:
          CI: 'Yes'

      - name: Bootstrap test master data
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute erpnext_thailand_localization.data.test_data.bootstrap_test_master_data
        env:
          CI: 'Yes'

      - name: Install Playwright
        working-directory: /home/runner/frappe-bench/apps/erpnext_thailand_localization/tests/ui
        run: |
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: /home/runner/frappe-bench/apps/erpnext_thailand_localization/tests/ui
        run: yarn test:ui
        env:
          CI: 'Yes'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: /home/runner/frappe-bench/apps/erpnext_thailand_localization/tests/ui/playwright-report/
          retention-days: 14
